# stamp: approve-first PR review. Installed by `bunx @jagreehal/stamp init`.
#
# One-time repo settings:
#   - the key for your model's provider as a secret (see STAMP_MODEL below), and STAMP_MODEL as a variable
#     when it is not claude-opus-5 on Anthropic
#   - Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests"
#     (without it the approval posts but does not satisfy a required-reviews rule)
name: stamp
on:
  # `/stamp` in a PR comment re-runs the review: the fix loop otherwise needs an empty commit.
  issue_comment:
    types: [created]
  pull_request:
    # `converted_to_draft` and `unlabeled` withdraw a standing approval: the draft/label skip paths retract it.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
  # Edits arrive through stamp-edited.yml, which calls this workflow for a base retarget or the author's
  # review-changes disclosure. The job `if` below still names both, since a called run sees the `edited` event.
  workflow_call:

concurrency:
  # Only runs that review share the PR's group, so a newer review supersedes an older one. A run the
  # job's `if` skips (an ordinary comment, or a bot rewriting the PR description after every push)
  # gets a group of its own: in the shared group it cancelled the review in flight after that review
  # had retracted the approval, leaving no verdict coming. The condition below is the job's `if`,
  # verbatim; a test keeps them in step. Two runs that do overlap order themselves by run marker.
  group: stamp-${{ github.event.pull_request.number || github.event.issue.number }}-${{ ((github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || (github.event.changes.body != null && github.event.sender.login == github.event.pull_request.user.login && contains(github.event.pull_request.body, '<!-- shepherd:review-changes -->')))) || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && startsWith(github.event.comment.body, '/stamp') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))) && 'review' || github.run_id }}
  cancel-in-progress: true # a newer head supersedes the review in flight

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # No draft/bot/label filter here on purpose: stamp itself decides whether to review, and it
    # retracts its stale approval on every skip path. A job-level `if` would skip the retraction too.
    # A comment never changes the head, so skipping one strands no approval. Only people who could
    # merge anyway may spend a run this way.
    if: >-
      (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null || (github.event.changes.body != null && github.event.sender.login == github.event.pull_request.user.login && contains(github.event.pull_request.body, '<!-- shepherd:review-changes -->'))))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '/stamp')
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung model call must not burn a runner for six hours; a killed run is fail-closed (the approval is already retracted)
    env:
      STAMP_VERSION: 0.1.0 # pinned: the engine decides what gets auto-approved, so bumps are deliberate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }} # on a comment event stamp fetches the head itself
          persist-credentials: false # no token in .git/config for a reviewer to read; stamp's fetches authenticate through gh
          fetch-depth: 1 # stamp fetches the base ref and origin/<default> itself, and unshallows only when a run reaches the familiarity signal
      # Bedrock through OIDC instead of AWS_BEARER_TOKEN_BEDROCK: add `id-token: write` under permissions,
      # then uncomment. The provider reads the credentials this step exports.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ vars.AWS_ROLE_ARN }}
      #     aws-region: ${{ vars.AWS_REGION }}
      - uses: oven-sh/setup-bun@v2
      - run: bunx "@jagreehal/stamp@$STAMP_VERSION" "$PR" --post --json "$RUNNER_TEMP/stamp.json"
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          STAMP_BOT_LOGIN: github-actions[bot]
          STAMP_CLI_IMAGE: stamp-reviewer:local
          STAMP_BUILD_CLI_IMAGE: '1' # Stamp prepares the packaged image after approval handling and gates
          STAMP_BACKEND: ${{ vars.STAMP_BACKEND }}           # empty = api; "claude" for Claude Code
          STAMP_BACKENDS: ${{ vars.STAMP_BACKENDS }}         # e.g. "claude,codex": a second opinion on non-trivial approvals (needs both auths)
          # api backend. STAMP_MODEL picks the provider: claude-opus-5 (Anthropic), bedrock:zai.glm-4.7-flash,
          # opencode-go:kimi-k3, opencode:claude-sonnet-5-5, openrouter:moonshotai/kimi-k3, gateway:anthropic/claude-sonnet-5.5.
          # Set the secret for that provider; the others stay empty.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}         # opencode-go:, opencode:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}     # openrouter:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}     # gateway: (Vercel AI Gateway)
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }} # bedrock: with an API key; or leave empty and use OIDC (step above)
          AWS_REGION: ${{ vars.AWS_REGION }}                        # bedrock:
          STAMP_GUARD: ${{ vars.STAMP_GUARD }}                      # empty = budget:$2,tokens:3m,loop:4/12,max-tools:80,timeout:15m
          STAMP_PRICING: ${{ vars.STAMP_PRICING }}                  # JSON per-1M prices for models autotel does not price
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }} # set to trace every review
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }} # empty = Anthropic direct; https://opencode.ai/zen/go for OpenCode Go
          STAMP_MODEL: ${{ vars.STAMP_MODEL }}               # empty = claude-opus-5; qwen3.8-max on Go
          # claude backend
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STAMP_CODEX_MODEL: ${{ vars.STAMP_CODEX_MODEL }}
          STAMP_CLAUDE_MODEL: ${{ vars.STAMP_CLAUDE_MODEL }} # empty = Claude Code's default
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }} # optional: Jev risk signals before the review
          # STAMP_LABEL: stamp                               # label mode: review only PRs carrying the label
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stamp-evidence-${{ github.event.pull_request.number || github.event.issue.number }}
          path: ${{ runner.temp }}/stamp.json
